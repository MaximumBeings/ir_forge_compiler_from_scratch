# Continuous integration for the Mountain Goat book: build the compiler, run the whole test suite, and build the site.
# The work is done by ./ci.sh, which you can run on your own machine; this file only prepares an Ubuntu 24.04 runner for it.
# History: this file was written in an environment that could not run GitHub Actions, then pushed. Its first real run (commit d8b1c2e)
# passed on a fresh runner: compiler built in 46 s, 102 tests passed in 24 s, docs built in 4 s. Chapter 25 records what that shows
# and what it does not (for example, the cache was saved by that run but a cache RESTORE had not yet been observed).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR 18 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev llvm-18-tools libmlir-18-dev mlir-18-tools cmake make

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools (lit, mkdocs)
        run: pip install -r requirements.txt

      # The compiler takes a few minutes to build; reuse it when no source file that goes into it has changed.
      - name: Cache the compiler build
        id: cache
        uses: actions/cache@v4
        with:
          path: docs/part31/code/build
          key: mg-opt-${{ runner.os }}-${{ hashFiles('docs/part31/code/*.cpp', 'docs/part31/code/CMakeLists.txt', 'docs/part31/code/MgOps.td', 'docs/part3/code/*', 'docs/part14/code/*', 'docs/part19/code/AssertToStderr.cpp') }}

      # An exact cache hit means no source that goes into the compiler changed, so the restored build is current and ci.sh skips building.
      # (Restoring the cache alone is not enough: build.sh recopies the sources, which makes `make` think everything changed and rebuild it.)
      - name: Build, test, and build the docs
        run: ./ci.sh
        env:
          CI_SKIP_BUILD: ${{ steps.cache.outputs.cache-hit == 'true' && '1' || '' }}
