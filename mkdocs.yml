site_name: IR Forge -- Mountain Goat, An MLIR/LLVM Compiler From Scratch -- Under Development
site_description: A Toy Language Compiled Through a Real MLIR Dialect, Down to Real Native Machine Code
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/anvil

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  **/build/
  **/tree/
  **/work/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Background (LLVM and MLIR in Twenty Minutes): background.md
  - "The Mountain Goat Language: A Short Tour": tour/language-tour.md
  - "Part 0 -- Why a Multi-Level IR at All":
      - "1. Why a Multi-Level IR at All": part1/01-why-a-multi-level-ir-at-all.md
  - "Part 1 -- A Minimal Dialect From Scratch":
      - "2. A Minimal Dialect From Scratch: Mountain Goat's Own mg Dialect": part2/02-a-minimal-dialect-from-scratch.md
  - "Part 2 -- The Pass Infrastructure":
      - "3. The Real Pass Infrastructure: Canonicalizing Mountain Goat": part3/03-the-pass-infrastructure.md
  - "Part 3 -- Progressive Lowering":
      - "4. Progressive Lowering: Mountain Goat to affine, Two Real Ways": part4/04-progressive-lowering-to-affine.md
      - "5. Finishing Progressive Lowering: affine to scf to llvm": part5/05-affine-to-scf-to-llvm.md
  - "Part 4 -- Optimization Across Levels":
      - "6. Real Bufferization: Closing Chapter 4's Own Honest Gap": part6/06-real-bufferization.md
      - "7. Real Loop Transforms: Fusion, Tiling, and Unrolling at the affine Level": part7/07-real-loop-transforms.md
  - "Part 5 -- Code Generation via LLVM":
      - "8. A Standalone Native Executable: Mountain Goat Without MLIR At Runtime": part8/08-a-standalone-native-executable.md
      - "9. MLIR's Own Real C++ ExecutionEngine API, Called In-Process": part9/09-the-execution-engine-api.md
  - "Part 6 -- GPU Lowering":
      - "10. GPU Lowering: Mountain Goat to the gpu Dialect, NVVM, and Real PTX": part10/10-gpu-lowering-to-ptx.md
      - "11. The GPU Host Side: Device Memory, Real Runtime Calls, and a Stub Device": part11/11-the-gpu-host-side.md
  - "Part 7 -- Case Studies":
      - "12. Reading MLIR's Own Production Pipelines: What This Book's Compiler Is Missing": part12/12-reading-the-production-pipelines.md
      - "13. Dynamic Shapes: Closing Chapter 12's Biggest Unknown": part13/13-dynamic-shapes.md
      - "14. A Runtime Shape Check: Closing Chapter 13's Memory-Safety Hole": part14/14-runtime-shape-checks.md
      - "15. A Real Test Suite: lit, FileCheck, and Proof That the Tests Can Fail": part15/15-a-real-test-suite.md
      - "16. Testing the GPU Path and the Loop Transforms": part16/16-testing-the-gpu-path-and-loop-transforms.md
      - "17. Loop Transforms on Dynamic Bounds": part17/17-loop-transforms-on-dynamic-bounds.md
      - "18. Why Fusion Declines: Reading the Pass, and a Second Bug Found Along the Way": part18/18-why-fusion-declines.md
      - "19. A Better Abort: Reporting Assertion Failures on stderr": part19/19-a-better-abort.md
      - "20. The Mountain Goat Demo: A Surface Syntax, a Driver, and C++ Calling Compiled Code": part20/20-the-mountain-goat-demo.md
      - "21. More Operations: Subtract, Hadamard, Divide, Matrix Product, and Scalars": part21/21-more-operations.md
      - "22. Broadcasting, Reductions and relu: Enough Operations for a Neural-Network Layer": part22/22-broadcasting-reductions-and-relu.md
      - "23. Measuring Performance: Does Any of It Make the Code Fast?": part23/23-measuring-performance.md
      - "24. Closing the Gap: A Matrix Product That Walks Memory in a Better Order": part24/24-closing-the-matmul-gap.md
      - "25. Keeping It Working: Continuous Integration and the Tests the Early Chapters Never Had": part25/25-keeping-it-working.md
      - "26. Learning From Data: Gradient Descent in Mountain Goat": part26/26-learning-from-data.md
      - "27. Tensor Contractions as Matrix Products": part27/27-tensor-contractions.md
