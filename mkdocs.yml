site_name: IR Forge -- Mountain Goat, An MLIR/LLVM Compiler From Scratch -- Under Development
site_description: A Toy Language Compiled Through a Real MLIR Dialect, Down to Real Native Machine Code
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/anvil

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 -- Why a Multi-Level IR at All":
      - "1. Why a Multi-Level IR at All": part1/01-why-a-multi-level-ir-at-all.md
  - "Part 1 -- A Minimal Dialect From Scratch":
      - "2. A Minimal Dialect From Scratch: Mountain Goat's Own mg Dialect": part2/02-a-minimal-dialect-from-scratch.md

extra:
  social: []
